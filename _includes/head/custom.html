<!-- start custom head snippets -->

<!-- Site fonts: Newsreader for body copy, Inter for the sidebar contact card -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">

<!-- Apply the saved colour theme before paint, so there is no light flash -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('site-theme');
      if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); }
    } catch (e) {}
  })();
</script>

<link rel="icon" type="image/png" href="/assets/images/favicon-96x96.png" sizes="96x96" />

<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png" />

<link rel="manifest" href="/assets/images/site.webmanifest" />

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "none" } } }); </script>

    tex2jax: {

</script>
